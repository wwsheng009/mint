name: DevTools

on:
  push:
    branches: [main, develop]
    paths:
      - 'devtools/**'
      - 'runtime/**'
      - 'framework/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/devtools.yml'
  pull_request:
    paths:
      - 'devtools/**'
      - 'runtime/**'
      - 'framework/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/devtools.yml'

permissions:
  contents: read

concurrency:
  group: devtools-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: DevTools Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run DevTools tests
        run: go test -race ./devtools/... -count=1 -p 1
